name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            l3build
            luatex
            luaotfload
            fontspec
            unicode-math
            lm-math
            xits
            tex-gyre-math
            units
            xkeyval
            xcolor
            graphics
            amsmath
            hypdoc
            hyperref
            listings
            booktabs
            ulem
            microtype
            enumitem
            parskip
            geometry
            metalogo
            tools
            tcolorbox
            pgf
            caption
            makeindex

      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/.*\\ProvidesPackage{math-shorthandz}\[[0-9/]* v\([0-9.]*\).*/\1/p' math-shorthandz.sty)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != .sty v$version"; exit 1; }

      - name: Build the CTAN archive
        run: l3build ctan

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" math-shorthandz-ctan.zip --title "$GITHUB_REF_NAME" --generate-notes
